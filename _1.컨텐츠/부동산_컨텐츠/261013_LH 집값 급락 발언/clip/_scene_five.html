<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NK';src:url('file:///C:/Windows/Fonts/NotoSansKR-VF.ttf');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1E2330;--ink2:#4A5163;--muted:#8A8F9C;--line:#E7E1D6;
 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

.dots{background-image:radial-gradient(#E9E2D5 1.6px,transparent 1.6px);background-size:26px 26px}
:root{--ok-l:#E2F1E8;--pre-l:#E6ECF8}.fv{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:22px;padding:30px 36px}
.no{width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900}
.cl{font-size:44px;font-weight:900}.vd{font-size:38px;font-weight:900;border-radius:16px;padding:12px 22px;white-space:nowrap}</style></head><body class="dots"><div class="stage" style="display:flex;flex-direction:column;gap:20px;justify-content:center"><div class="card fv" id="f0"><div class="no">1</div><div class="cl">공급은 늦게 온다</div><div class="vd" id="g0" style="background:var(--ok-l);color:var(--ok)">숫자와 맞다</div></div><div class="card fv" id="f1"><div class="no">2</div><div class="cl">대출로 경쟁적으로 산다</div><div class="vd" id="g1" style="background:var(--ons-l);color:var(--ons)">반만 보인다</div></div><div class="card fv" id="f2"><div class="no">3</div><div class="cl">금리가 계속 오른다</div><div class="vd" id="g2" style="background:var(--ons-l);color:var(--ons)">방향만 맞다</div></div><div class="card fv" id="f3"><div class="no">4</div><div class="cl">기다리면 손해 안 본다</div><div class="vd" id="g3" style="background:var(--pre-l);color:var(--pre)">언제·어디냐에 달렸다</div></div><div class="card fv" id="f4"><div class="no">5</div><div class="cl">급락할 가능성이 많다</div><div class="vd" id="g4" style="background:var(--red-l);color:var(--red)">지금 지표로는 안 보인다</div></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function F(t){for(let i=0;i<5;i++){const v=P(t,.1+i*.25,.4+i*.25);$('#f'+i).style.opacity=v;
const s=P(t,1.6+i*.5,1.85+i*.5);$('#g'+i).style.opacity=s;$('#g'+i).style.transform=`scale(${1.5-.5*s})`}}</script></body></html>
