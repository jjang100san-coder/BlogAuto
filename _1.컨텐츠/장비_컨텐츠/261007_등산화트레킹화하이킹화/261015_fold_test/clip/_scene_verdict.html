<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NK';src:url('file:///C:/Windows/Fonts/NotoSansKR-VF.ttf');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1E2330;--ink2:#4A5163;--muted:#8A8F9C;--line:#E7E1D6;
 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}
html,body{width:1350px;height:1338px}
body{font-family:'NK',sans-serif;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:70px;right:70px;top:250px;bottom:263px}
.card{background:var(--card);border-radius:30px;box-shadow:0 2px 0 rgba(30,35,48,.04),0 16px 40px rgba(30,35,48,.09);border:1px solid #EFE9DF}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 22px;font-weight:800}
.big{font-weight:900;letter-spacing:-.03em;line-height:1}
.mut{color:var(--muted)}
.ab{position:absolute}
.icon3d{object-fit:contain;filter:drop-shadow(0 14px 18px rgba(30,35,48,.16))}
svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{background-image:radial-gradient(#E9E2D5 1.6px,transparent 1.6px);background-size:26px 26px}
.vr{display:flex;justify-content:space-between;align-items:center;padding:24px 50px}.nm{font-size:56px;font-weight:900}.kd{font-size:34px;font-weight:700;color:var(--muted);margin-top:6px}
.ok{display:flex;align-items:center;gap:14px;font-size:54px;font-weight:900;color:var(--ok);background:var(--ok-l);border-radius:20px;padding:14px 26px}
.stamp{align-self:center;font-size:70px;color:var(--red);border:9px solid var(--red);border-radius:24px;padding:14px 34px;background:rgba(255,255,255,.92);white-space:nowrap;margin-top:6px}</style></head><body class="dots"><div class="stage" style="display:flex;flex-direction:column;gap:18px;justify-content:center"><div class="card vr" id="v0"><div><div class="nm">캠프라인 밴티지</div><div class="kd">경등산화</div></div><div class="ok" id="o0"><svg class="i" viewBox="0 0 24 24" style="width:54px;height:54px;color:#2F8F5B;stroke-width:3.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>접혔다</span></div></div><div class="card vr" id="v1"><div><div class="nm">아식스</div><div class="kd">러닝화</div></div><div class="ok" id="o1"><svg class="i" viewBox="0 0 24 24" style="width:54px;height:54px;color:#2F8F5B;stroke-width:3.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>접혔다</span></div></div><div class="card vr" id="v2"><div><div class="nm">퓨마</div><div class="kd">러닝화</div></div><div class="ok" id="o2"><svg class="i" viewBox="0 0 24 24" style="width:54px;height:54px;color:#2F8F5B;stroke-width:3.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>접혔다</span></div></div><div class="stamp big" id="st">접기만으론 못 가린다</div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function F(t){for(let i=0;i<3;i++){const v=P(t,.1+i*.3,.4+i*.3);$('#v'+i).style.opacity=v;$('#o'+i).style.transform=`scale(${K(P(t,.8+i*.4,1.1+i*.4))})`}
const s=P(t,2.4,2.7);$('#st').style.opacity=s;$('#st').style.transform=`scale(${1.5-.5*s}) rotate(-4deg)`}</script></body></html>
