const SYN_MD = "# 261003 대출 영상 top10 — 전체 데이터 종합 · 분석 · 추론\n\n- 기준일 2026-10-04 · 영상 업로드 09-07 ~ 09-28(최근 한 달) · 10편 합계 조회 약 561만 · 합계 길이 2시간 53분\n- **방법**: 요약본이 아니라 10편 **전체 자막을 처음부터 끝까지 다시 읽고**, 주장 127개를 시각·화자 단위로 뽑았다. 화면 시트(자막 그래픽·그래프·숫자 박스)와 대조해 검증 등급을 붙였다. 같은 방송 꼭지가 여러 영상에 재사용된 경우 **한 번만** 셌다. 원 데이터는 [02_주장데이터_전체.csv](02_주장데이터_전체.csv), 숫자 대조는 [03_숫자대조표.md](03_숫자대조표.md)에 있다.\n- **등급**: 🟢 화면확인 39 · 🟡 음성만 24 · 🔴 확인필요 4 · ⚪ 의견·전망·처방 57 · ⛔ 광고 3\n- 이 문서는 영상 내용을 분석한 것이다. 투자·대출 권유가 아니다. 영상 속 수치는 대부분 화자의 발언이므로, 블로그에 인용하려면 원자료를 확인해야 한다.\n\n---\n\n## 0. 결론 먼저\n\n1. **10편이 모두 \"주담대 7% 돌파\"를 기정사실로 말한다.** 8/27 NH농협 7.17%(02, 화면) → 9/17 상단 7.29%(06, 화면) → 9/27 \"7.26% 찍고 7% 중반\"(01). 숫자는 조금씩 달라도 **7%를 넘었다는 데 반론은 0편**이다. 갈리는 건 다음 단계다. \"8%는 시간문제\"(06·03·04)라는 쪽과 \"9%도 가능\"(02)이라는 쪽이 있다.\n2. **불안의 진원지는 \"5년 고정이 끝나는 2021년 차주\"다.** 01·02·06·07·09가 같은 구조를 말한다. 2021년 기준금리 0.5% 시절에 3% 안팎의 **혼합형(5년 고정 후 변동)** 대출을 받은 사람들이 지금 재산정을 맞는다는 것이다. 은행 \"고정형\"의 대부분이 실은 5년만 고정이라는 점은 09가 화면으로 짚었다.\n3. **\"이자 2~3배\"와 \"월 상환 1.5배\"는 둘 다 맞다. 기준이 다를 뿐이다.** 09의 사례로 직접 계산하면 3%→7%에서 **이자는 2.33배, 원리금은 1.49배**다. 02(\"최대 2~3배\")·06(\"2배 이상\")·01(\"두 배\")은 이자만 본 숫자이고, 09·04는 원리금을 본 숫자다. 영상들이 이 둘을 섞어 쓰고 있다. 블로그에서 가장 쓸모 있는 정리가 이 대목이다(§4).\n4. **경매가 늘어난다는 방향은 같지만, 숫자는 3배 차이가 난다.** 02는 2025년 임의경매 신청을 **7.3만 건**이라 했고, 09는 같은 해를 **2만 4,848건**이라 했다. 09는 화면에 '집합건물 · 대법원 등기정보광장'이라고 밝혔다. 02는 '대법원 경매정보 통계'라고만 했고, 범위를 밝히지 않았으며 2026년도 그래프에서 뺐다. 범위가 다른 통계를 섞었을 가능성이 크다(§5). **원자료를 확인하기 전에는 인용 금지.**\n5. **\"최근 한 달 영상\"이 \"최근 한 달 정보\"는 아니다.** KBS 4편은 꼭지를 재편집한 묶음이라 6/15·6/26·7/6·7/15 방송이 9월 업로드에 섞여 있다. 06도 녹화일이 다른 5개 방송을 이어 붙였다. 같은 영상 안에서 미 금리 인상이 \"어제 됐다\"(1구간)는 말과 \"내일 결정\"(2구간)이라는 말이 공존한다. **인용할 때는 업로드일이 아니라 꼭지의 방송일·녹화일을 써야 한다.**\n6. **대출 이야기만 따지면 실제로는 약 1시간 45분이다.** 합계 2시간 53분 가운데 같은 꼭지 재방송이 약 23분이다. 06의 2~5구간(바이백·농지법·종부세·은퇴 아파트)처럼 대출과 무관한 부분도 약 45분이다.\n\n---\n\n## 1. 어떤 영상이 뽑혔나\n\n**선정**: 유튜브 검색어 13개(대출 · 주택담보대출 · 주담대 · 전세대출 · 대출 금리 · 대출 이자 · 영끌 대출 · 대출 규제 · 대출 한도 · 신용대출 · 디딤돌 대출 · 생애최초 대출 · 스트레스 DSR)를 '이번 달 · 조회수순'으로 돌렸다. 후보 87편 가운데 **대출 자체를 다룬 정보 영상**만 남기고 조회수로 줄을 세웠다. 예능·사연(조회 400만의 '대출받아서 싹다사왔습니다' 등)과 증권사 광고는 뺐다. 11위는 부읽남TV(27.9만)였다.\n\n| 순위 | 채널 | 제목(요약) | 업로드 | 길이 | 조회 | 성격 |\n|---|---|---|---|---|---|---|\n| 01 | 표영호tv | 집은 샀는데 팔 수가 없습니다 (박은정 감정평가사) | 09-27 | 15:52 | 115.4만 | 대담 · 앞선 14편 분석에서 재사용 |\n| 02 | 표영호tv | 왜 겁도 없이 빚을 왕창 내서 샀을까? | 09-13 | 13:06 | 82.2만 | 단독 강의 · 광고 2건 |\n| 03 | 집코노미 | 2030 영끌족은 주담대 이렇게 갚으세요 | 09-11 | 13:43 | 68.2만 | 판서 해설(상환 방식) |\n| 04 | KBS News | [이슈] 경매 물건 쏟아진다 (9/12) | 09-12 | 27:54 | 61.4만 | **묶음**: 05 전체 + 6/26 + 6/15 |\n| 05 | KBS News | [이슈] 금리 갱신 앞둔 영끌족 덮친 '공포' (9/7) | 09-07 | 17:35 | 60.7만 | **묶음**: 09 + 8/28 + 7/15 + 7/6 |\n| 06 | 표영호tv | 빚 축제의 악몽. 8% 넘어갈 무서운 금리 (몰아보기) | 09-27 | 66:10 | 41.1만 | **묶음**: 5개 방송, 대출은 앞 21분 |\n| 07 | KBS News | [이슈] 금리 1%대 이자 지원 신청 폭주 (9/28) | 09-28 | 9:59 | 36.9만 | **묶음**: 9/28·9/21·8/28 |\n| 08 | MTN | [여의도튜브] 美 모기지 '7%의 공포' | 09-12 | 3:06 | 34.0만 | 미국 뉴스 · 광고 1건 |\n| 09 | KBS News | 경매 물건 쏟아진다 [잇슈 머니] (9/7) | 09-07 | 2:44 | 30.5만 | 단일 꼭지 · 계산 그래픽 |\n| 10 | SBS 뉴스 | 국민들 틀어막고 뒤로는 '꿀 대출' (에디터픽) | 09-15 | 2:33 | 30.4만 | 8뉴스(9/14) 재업로드 |\n\n- **채널 쏠림**: 표영호tv 3편이 조회의 **42.6%**(238.8만), KBS 4편이 **33.8%**(189.5만)를 차지한다. 상위 10편 중 7편이 두 채널에서 나왔다.\n- **형식 쏠림**: 단독 꼭지(09·10·08)는 3분 이하다. 반면 조회 상위는 대담·강의(01·02·03)와 묶음(04·05·06)이다. \"짧은 뉴스 → 긴 묶음으로 다시 올리기\"가 조회를 두 번 얻는 구조다(§2).\n\n---\n\n## 2. 겹침 지도 — 10편이지만 이야기는 7개\n\n```\n09 (9/7 잇슈머니, 2:44)\n └─▶ 05 00:00–02:31  (같은 꼭지)\n07의 8/28 '기준금리 3% 시대' 꼭지\n └─▶ 05 02:31–05:43  (같은 꼭지)\n05 (9/7, 17:35) 전체\n └─▶ 04 00:00–17:37  (그대로 앞에 붙음)\n04 = 05 + 6/26 '보험 약관대출 빚투' + 6/15 KBS경남 '은행채 5년물 4.473%'\n06 = 9/17 금리 + 바이백·중간선거(9/16?) + 농지법 + 종부세 환급 + 2030 종부세·은퇴 아파트\n10 = SBS 8뉴스(9/14, -i968PSpsIQ, 12.3만)의 재업로드\n```\n\n- KBS 4편(04·05·07·09)의 꼭지를 날짜별로 풀면 **6/15 → 6/26 → 7/6 → 7/15 → 8/28 → 9/7 → 9/21 → 9/28**이다. 석 달 반의 금리 이야기가 9월 업로드 네 편에 흩어져 있다. 그 덕분에 **이 묶음만 따라 읽어도 금리 타임라인이 거의 복원된다**(§3).\n- 04·05 제목의 **'깡통전세'는 영상 어디에도 나오지 않는다.** 화면에도 음성에도 없다. 제목만 보고 전세 사기 글감으로 쓰면 안 된다.\n- 06의 녹화일: 1구간은 04:11 \"17일 … 오후 1시\", 04:29 \"어제 새벽에 올랐죠\"로 보아 **9/17**이다. 2구간은 30:11 \"바로 내일 결정\"이므로 **미 결정 전날**이다.\n\n---\n\n## 3. 금리 타임라인 (영상 속 발언을 날짜순으로)\n\n| 날짜(방송·녹화) | 한국 | 미국 | 출처 |\n|---|---|---|---|\n| 6/15 | 은행채 5년물 **4.473%**(2023.11 이후 최고), 국민·농협 주담대 +0.2%p | 고금리 장기화(관세·재정·중동 유가) | 04 22:30 |\n| 6/26 | 신용융자 38.5조(역대 최대), 생보사 약관대출 5개월 +1조, 반대매매 373억(3.7배) | — | 04 17:44~ |\n| 7/15 | 5월 신규 가계대출 4.46%, 신규 주담대 고정 비중 41.6% | 2년물 4.28%, 6월 CPI 3.5% | 05 06:36~ |\n| 7/16 | 기준금리 2.50 → **2.75%** 전망(3년 6개월 만 인상) | — | 05 05:52 |\n| 8/27~28 | 기준금리 **3.00%**(두 달 연속), 코픽스 4개월 연속↑, 5대 은행 상단 NH **7.17%** | — | 02 00:18 · 07 06:49 |\n| 9/7 | 2021년 혼합형 5년 고정 **재산정 도래**, 한은 추산 +0.25%p → 연 29.6만 원 | — | 09 |\n| 9/10 | — | 10년물 **4.9%**, 30년 모기지 **7.07%** | 08 |\n| 9/11 | 기준금리 3%, 상단 7% 초과·8% 접근 | — | 03 00:04 |\n| 9/17 | 은행채 5년물 **4.655%**, 상단 **7.29%** | 3년 2개월 만에 인상, 10년물 **5.041%**(음성) | 06 |\n| 9/21 | 고정형 상단 7% 넘는 곳, 1~8월 수도권 전세 4.30% > 매매 4.06% | — | 07 02:58~ |\n| 9/27 | 상단 7.26% 찍고 7% 중반 | — | 01 05:08 |\n\n- **흐름은 한 방향이다.** 은행채 5년물이 4.473%에서 4.655%로 석 달 새 0.18%p 올랐다. 그동안 기준금리는 두 번(2.50 → 3.00%) 올랐고, 주담대 상단은 \"8% 가능\"이라는 전망에서 실제 7%대로 올라섰다.\n- **🔴 미 10년물 숫자가 엇갈린다.** 9/10 4.9%(08) → 9/17 5.041%(06, 음성만) → 9/21 4.96%(앞선 14편 분석의 02 파일럿 화면) → 9/30 5.22%(같은 화면). 9/17에 5%를 넘었다가 9/21에 다시 내려왔을 수는 있다. 그러나 06의 5.041%는 화면 그래픽으로 확인되지 않았다. **날짜를 붙이지 않으면 서로 모순으로 읽힌다.**\n- **🟡 변동금리 비중**: 05(7/15)는 5월 신규 주담대의 **고정 비중이 41.6%**(변동 58.4%)라고 했다. 02(9/13)는 **변동 비중 68.1%**가 \"12년 5개월 만에 최고\"라고 했다. 시점이 다르면 둘 다 맞을 수 있다. 다만 02는 기준 월과 신규·잔액 구분을 밝히지 않았다.\n\n---\n\n## 4. \"이자 2~3배\" vs \"월 상환 1.5배\" — 계산 방식이 결론을 바꾼다\n\n| 영상 | 조건 | 계산 방식 | 전 → 후 | 배수 | 검증 |\n|---|---|---|---|---|---|\n| 09 | 3억·30년·3%, 5년 뒤 잔액 2.67억을 25년 재산정 | **원리금균등 재산정** | 127만 → 189만(7%) / 206만(8%) | **1.49 / 1.62배** | ✅ 126.5 / 188.5 / 205.9만 |\n| 〃(직접 계산) | 같은 잔액 2.67억 | **이자만** | 66.7만 → 155.6만(7%) / 177.8만(8%) | **2.33 / 2.67배** | 계산 |\n| 04(6/15 PB) | 3억·30년 | 원리금균등 | 161만(5%) → 220만(8%) | 1.37배 | ✅ 161.0 / 220.1만 |\n| 02 | 4억, 4% → 6% | **이자만** | 133만 → 200만 | 1.5배 | ✅ |\n| 06 | 5억, 8% | **이자만** | 333만 | — | ✅ |\n| 01 | 5억(지인 일화) | 미상 | 250만 → 330만 | 1.32배 | 이자만이면 6% → 7.9%에 해당 |\n| 07 | 원금 미제시, 3%대 → 5% | 원리금 | +50만 | — | ⚠️ 3억·30년 기준이면 +35만, 50만이 되려면 원금 약 4.3억 |\n| 03 | 3억·30년·5% | 원리금 / 원금 / 체증식 | 161만 / 1회차 206만 / 1회차 127만 | — | ✅ 1회차 이자 123만은 **일할(30/365)** 기준 |\n\n**읽는 법**\n- \"부담 2배·3배\"(02 01:36, 06 11:02, 01 02:52)는 **이자만 따질 때** 나오는 숫자다. 원금 상환분은 금리와 상관없이 비슷하다. 그래서 **실제 통장에서 빠지는 돈은 1.4~1.6배** 늘어난다.\n- 반대로 \"1.5배니까 괜찮다\"고 볼 수도 없다. 09의 사례만 해도 월 62~79만 원이 는다. 한은 추산으로 차주 평균은 0.25%p에 연 29.6만 원이다(09). 사례 금액과 평균 금액의 차이는 대출 규모가 다르기 때문이다.\n- 03의 1회차 이자 123만 원은 월할(125만)이 아니라 **일할 30일** 기준이다. 블로그 표에는 계산 기준을 각주로 단다.\n\n---\n\n## 5. 경매 숫자 충돌 — 같은 '임의경매'가 3배 다르다\n\n| | 02 표영호tv(9/13) | 09 KBS(9/7) |\n|---|---|---|\n| 2025년 | **7.3만 건** | **2만 4,848건** |\n| 2026년 | 그래프에서 생략, 2027년 9만 건(화자 예측) | 1~8월 1만 8,050건 → \"최고치 경신할 듯\" |\n| 범위 | 미표기 | **전국 집합건물**(아파트·오피스텔·다세대 등) |\n| 출처 표기 | 대법원 경매정보 통계 | 대법원 등기정보광장 |\n| 화면 | 막대그래프 22~25 | 막대그래프 + 출처 |\n\n- **추론**: 02는 토지·단독주택까지 포함한 '전체 부동산' 임의경매 신청이고, 09는 '집합건물'만 센 것으로 보인다. 둘 다 틀리지 않았을 수 있다. 하지만 02는 범위를 밝히지 않았고, 화면에서 2026년을 뺐다. 그래서 2025년 7.3만에서 곧바로 '27년 9만'으로 이어진다.\n- 01(박은정)은 \"2023년부터 매년 최고치\"라고 했다. 06은 \"낙찰가율이 뚝뚝 떨어진다\"고만 했고 숫자는 없다. 앞선 14편 분석에서는 12(리치고)의 화면이 서울 아파트 경매가 2024년 고점 이후 감소했다고 보여 줬다. **전국·전 유형 / 집합건물 / 서울 아파트 세 범위를 섞으면 방향까지 뒤집힌다.**\n- 블로그에 쓰려면 **대법원 등기정보광장에서 '집합건물 임의경매개시결정등기 신청'을 직접 조회**한다. 범위와 기간을 밝힌 뒤 한 계열로만 쓴다.\n\n---\n\n## 6. 합의와 갈림\n\n**합의(반론 0편)**\n- 주담대 상단 7% 돌파(01·02·03·06·07)\n- 2021년 혼합형 차주의 재산정 충격(01·02·06·07·09)\n- 경매 증가 방향(01·02·04/05/09·06). 숫자는 §5 참조.\n- 변동금리 쏠림 때문에 금리 상승에 더 취약하다(02·05·07 8/28)\n- 피해는 서민·중산층, 중가 아파트 차주에게 집중된다. 강남 고가는 대출이 적다(02·06·01)\n\n**갈림**\n| 쟁점 | A | B |\n|---|---|---|\n| 다음 금리 | 11월 한은 인상 → 상단 8%(06) / 한은 인상 시 8%(04 6/15) | 내년 기준금리 3.5% → 상단 9%(02, 근거 미제시) |\n| 집값 | 중간 가격대(84㎡ 12~16억) 6개월 안 하락(06) · \"폭풍의 초입\"(01) | 전세난에 밀린 매수로 외곽 중저가 상승(07 9/21) · 규제지역이 더 오르는 역설(05 7/6) |\n| 원인 | 미 국채·유가 → 은행채(04·06·08) | 가계대출 총량 규제로 우대금리 축소·가산금리↑(04 6/15) · 예대금리차 2.22%p(07 8/28) |\n\n- 원인 쪽은 대립이라기보다 **층위가 다르다.** 시장금리(은행채)가 오른 데다 은행의 가산·우대 조정이 겹쳤다. 04의 6/15 PB가 세 경로를 한꺼번에 설명한 유일한 꼭지다.\n\n---\n\n## 7. 제목과 내용의 거리, 그리고 상업적 연결\n\n| 영상 | 제목이 말하는 것 | 실제 |\n|---|---|---|\n| 04·05 | '깡통전세' 세입자 불똥 | 해당 내용 없음 |\n| 04 | 9/12 방송 | 9/7·8/28·7/15·7/6·6/26·6/15 꼭지 묶음 |\n| 06 | 8% 넘어갈 금리 | 대출은 66분 중 21분(32%) |\n| 07 | 보증기금 빚 '탕감' 5배 | 대위변제(보증 부실) 500억 → 2,500억. 탕감이 아니다 |\n| 08 | \"2008 금융위기 또 오나?\" | 미 모기지 7%·기존주택 거래 감소 보도. 금융위기 논증 없음 |\n| 10 | 에디터픽 | 8뉴스(9/14) 재업로드. 원본 조회 12.3만 |\n\n- **광고·유입**: 02는 07:45에 상조·통신 지원금 광고(약 1분)를 넣었고, 11:10에는 저평가 주택 세미나를 예고했다. 08은 끝에 자사 쇼핑몰 건강식품 광고를 붙였다. 06은 설명란에 멤버십 링크를 달았다. ⛔로 분리했다.\n- 06의 5구간(은퇴 후 살 아파트, 특정 단지 지도)은 **특정 매물 추천**이다. 블로그로 옮기지 않는다.\n\n---\n\n## 8. 영상들이 공통으로 권한 대응 (요약 · 권유 아님)\n\n| 대응 | 말한 영상 |\n|---|---|\n| 내 대출의 금리·고정/변동·재산정 시점·잔액·소득 대비 원리금 비중 점검 | 02 08:54 · 07 |\n| 금리인하요구권(모바일, 마이데이터 연동) | 04 25:51 · 07 04:27 |\n| 정책 모기지(보금자리론·디딤돌·적격대출)·대환. 중도상환수수료와 대출 경과 기간(3년) 확인 | 04 · 05 09:38 · 02 |\n| 금리 높은 대출부터 상환(무위험 수익), 레버리지 축소 | 05 09:38 · 02 |\n| 신규 대출은 원리금이 가구 소득의 30~40% 이하 | 04 25:51 · 06 13:33(8%면 30~40% 넘을 수 있다) |\n| 상환 방식은 중간에 못 바꾼다 — 체증식은 정책대출·만 40세 미만에서만 | 03 08:21 · 11:21 |\n| 대출을 일으켜야만 살 수 있는 집이면 지금은 멈춤 | 06 12:26 · 01 14:53 |\n\n---\n\n## 9. 추론 — 데이터를 넘어서 (근거와 한계를 함께 적는다)\n\n1. **\"2배·3배\" 공포가 조회를 끈다. 정작 쓸모 있는 건 계산표다.** 조회 2·6위(02·06)는 이자만 계산한 배수를 제목과 썸네일에 썼다. 3위 집코노미(68.2만)는 공포 없이 상환 방식 비교 판서만으로 3위에 올랐다. → 블로그는 \"이자 2.3배, 원리금 1.5배\"를 **같은 표에 나란히** 두는 쪽이 차별점이다. (근거: §4. 한계: 조회수에는 채널 구독자 규모가 섞여 있다. 집코노미 65.8만, 표영호tv 87.2만.)\n2. **재산정 충격은 '한 번'이 아니라 '줄줄이'다.** 2021년 한 해에 받은 혼합형만 해도 만기가 2026년 내내 분산돼 돌아온다. 01 04:59의 \"차례로 같은 상황\"이 그 뜻이다. 09의 임의경매가 1~8월에 이미 전년의 73%라는 점(1만 8,050 / 2만 4,848)도 같은 방향을 가리킨다. (한계: 재산정 도래 규모를 숫자로 제시한 영상은 없다.)\n3. **8% 도달 여부는 한은 11월 결정에 달렸다고 영상들은 본다.** 그러나 그 전망의 근거는 한미 금리차(1%p)와 환율뿐이다. 국내 물가·성장 지표를 근거로 든 영상은 없다. 07(8/28)은 \"성장은 반도체 중심, 체감경기는 뒷걸음질\"이라고 해서 오히려 반대 근거를 냈다. → **\"8% 확정\"으로 쓰면 안 된다.**\n4. **정책대출·사내대출은 금리 상승기의 '틈'으로 떠올랐다.** 07의 부산 이자 지원은 시행 첫날 6천 건이 접수됐다. 10의 공공기관 사내대출은 2.2~2.5%다. 둘 다 \"시장금리 7%와의 격차\"가 뉴스가 된 경우다. 반면 07은 같은 꼭지에서 보증 부실 5배도 보여 줬다. **싼 정책금리 뒤에는 보증 부실이 쌓인다**는 짝을 이룬다.\n\n---\n\n## 10. 글감 (뜻 기준)\n\n- **[대출 계산] 금리 3% → 7%, 이자는 2.3배인데 월 상환은 1.5배** — 09·04·03 숫자를 검증했다. 원리금균등 재산정 표 + 이자만 표를 나란히 둔다. 자체 계산 카드로 만든다.\n- **[대출 점검] 5년 고정이 끝나는 혼합형 차주 체크리스트** — 재산정 시점, 금리인하요구권, 정책 모기지 대환, 중도상환수수료, 소득 대비 원리금 30~40%를 다룬다. 영상 7편의 공통 처방을 정리한다.\n- **[상환 방식] 원리금균등·원금균등·체증식 3억 30년 비교** — 03을 검증했다. 일할·월할 차이를 각주로 단다. 체증식 자격(정책대출·만 40세 미만)도 함께 쓴다.\n- **[경매 통계] 임의경매 숫자가 영상마다 3배 다른 이유** — 범위(전체 / 집합건물 / 서울 아파트)를 설명하는 글이다. **등기정보광장 원자료를 조회한 뒤에만** 쓴다.\n- **[금리 흐름] 6월부터 9월까지 주담대 금리 연표** — §3 표를 쓴다. 방송일을 기준으로 하고, 미 10년물은 날짜를 붙여서만 쓴다.\n- (보조) **[정책] 부산 소상공인 이자 지원 실부담 1%대 계산** — 지역 한정이다. 시행 직후라 시의성은 짧다.\n- (보조) **[형평] 공공기관 사내대출 지침 위반** — 9/14 뉴스다. 후속 보도를 확인한 뒤에 쓴다.\n\n---\n\n## 11. 한계 · 남은 확인\n\n- 모두 1순위(로컬) 추출이다. 유료 폴백은 0회였다. 30분이 넘는 06은 `_컷통계.py`로 컷 통계를 따로 실측했다.\n- 01은 앞선 14편 분석(261002_부동산)의 결과를 그대로 참조했다(`261003_L7C1C4qCz30_기존분석참조`).\n- 원자료 대조가 필요한 것: 임의경매(등기정보광장), 변동금리 비중 68.1%(한은 가중평균금리 통계), 미 10년물 9/17 값, 서울 아파트 '현 정부 14%'(06, 출처 미제시).\n- 조회수는 10/4 수집 기준이다. 선정 이후에도 계속 변한다.\n";

/* --- 간단 마크다운 렌더러(오프라인용) --- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function md(src){
  const L = src.replace(/\r/g,"").split("\n"); let o=[], i=0;
  while(i<L.length){
    let l=L[i];
    if(/^```/.test(l)){ let b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(esc(L[i++])); i++; o.push("<pre><code>"+b.join("\n")+"</code></pre>"); continue; }
    if(/^#{1,6} /.test(l)){ const n=l.match(/^#+/)[0].length; o.push(`<h${n}>${inline(l.slice(n+1))}</h${n}>`); i++; continue; }
    if(/^---+\s*$/.test(l)){ o.push("<hr>"); i++; continue; }
    if(/^\|/.test(l)){
      let rows=[]; while(i<L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|\s*$/g,"").split("|").map(c=>c.trim());
      let h=cells(rows[0]), body=rows.slice(/^\|[\s:|-]+\|?\s*$/.test(rows[1]||"")?2:1);
      o.push('<div class="tw"><table><thead><tr>'+h.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
        body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");
      continue;
    }
    if(/^> /.test(l)){ let b=[]; while(i<L.length && /^> /.test(L[i])) b.push(inline(L[i++].slice(2))); o.push("<blockquote>"+b.join("<br>")+"</blockquote>"); continue; }
    if(/^\s*([-*]|\d+\.) /.test(l)){
      const ord=/^\s*\d+\./.test(l); let items=[];
      while(i<L.length && (/^\s*([-*]|\d+\.) /.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        const t=L[i++];
        if(/^\s*([-*]|\d+\.) /.test(t)){
          const sub=/^\s{2,}/.test(t); const txt=inline(t.replace(/^\s*([-*]|\d+\.) /,""));
          if(sub && items.length) items[items.length-1]+= "<br>· "+txt; else items.push(txt);
        } else items[items.length-1]+=" "+inline(t.trim());
      }
      o.push((ord?"<ol>":"<ul>")+items.map(x=>"<li>"+x+"</li>").join("")+(ord?"</ol>":"</ul>")); continue;
    }
    if(!l.trim()){ i++; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#|\||> |```|---|\s*([-*]|\d+\.) )/.test(L[i])) p.push(L[i++]);
    o.push("<p>"+inline(p.join(" "))+"</p>");
  }
  return o.join("\n");
}

const order=["🟢 화면확인","🟡 음성만","🔴 확인필요","⚪ 의견","⛔ 광고"];
document.getElementById("gbar").innerHTML=order.map(g=>`<i style="width:${(gc[g]||0)/C.length*100}%;background:${gcol[gcls(g)]}" title="${g} ${gc[g]||0}"></i>`).join("");
document.getElementById("glegend").innerHTML=order.map(g=>`<span><em style="background:${gcol[gcls(g)]}"></em>${g} ${gc[g]||0}</span>`).join("");
const sec0 = SYN_MD.split(/\n## /)[1]||""; document.getElementById("concl").innerHTML = md("## "+sec0.replace(/\n---[\s\S]*$/,""));
document.getElementById("vgrid").innerHTML=V.map(v=>`<div class="v" data-v="${v.no}"><div><span class="no">${v.no}</span><span class="t">${esc(v.channel)}</span></div><div class="m">${esc(v.people)}</div><div class="m">${esc(v.title)}</div><div class="m">${v.date} · ${v.length} · 조회 ${(v.views/10000).toFixed(1)}만 · 주장 ${v.claims}</div></div>`).join("");
document.querySelectorAll(".v").forEach(el=>el.onclick=()=>{ fv.value=el.dataset.v; ft.value=fg.value=fn.value=""; fq.value=""; render(); show("claims"); });

/* --- 종합 / 숫자 --- */
document.getElementById("synmd").innerHTML=md(SYN_MD);
document.getElementById("numsmd").innerHTML=md(NUMS_MD);

/* --- 주장 탐색 --- */
const fv=document.getElementById("fv"), ft=document.getElementById("ft"), fg=document.getElementById("fg"), fn=document.getElementById("fn"), fq=document.getElementById("fq");
V.forEach(v=>fv.insertAdjacentHTML("beforeend",`<option value="${v.no}">${v.no} ${esc(v.channel)}</option>`));
[...new Set(C.map(c=>c.topic))].sort().forEach(t=>ft.insertAdjacentHTML("beforeend",`<option>${t}</option>`));
order.forEach(g=>fg.insertAdjacentHTML("beforeend",`<option>${g}</option>`));
[...new Set(C.map(c=>c.nature))].forEach(n=>fn.insertAdjacentHTML("beforeend",`<option>${n}</option>`));
const vmap=Object.fromEntries(V.map(v=>[v.no,v]));
function render(){
  const q=fq.value.trim().toLowerCase();
  const r=C.filter(c=>(!fv.value||c.v===fv.value)&&(!ft.value||c.topic===ft.value)&&(!fg.value||c.grade===fg.value)&&(!fn.value||c.nature===fn.value)&&
    (!q||(c.claim+" "+c.nums+" "+c.who+" "+c.note+" "+c.channel).toLowerCase().includes(q)));
  document.getElementById("cnt").textContent=r.length+" / "+C.length+"건";
  document.getElementById("clist").innerHTML=r.map(c=>`<div class="c"><div class="h">
    <span class="chip">${c.v} ${esc(c.channel)}</span><a href="${c.url}" target="_blank" rel="noopener">${c.t}</a><span>${esc(c.who)}</span>
    <span class="chip">${c.topic}</span><span class="chip ${gcls(c.grade)}">${c.grade}</span></div>
    <div class="tx">${esc(c.claim)}</div>
    ${c.nums?`<div class="nm">수치: ${esc(c.nums)}</div>`:""}
    ${c.screen?`<div class="nm">화면: ${esc(c.screen)}</div>`:""}
    ${c.note?`<div class="note">${esc(c.note)}</div>`:""}</div>`).join("");
}
[fv,ft,fg,fn].forEach(e=>e.onchange=render); fq.oninput=render; render();
try{ const t=localStorage.getItem("loan261003-tab"); if(t && document.getElementById(t)) show(t); }catch(e){}
</script>
</body>
</html>
