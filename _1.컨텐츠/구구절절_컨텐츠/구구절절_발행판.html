<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding:16px 16px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:12px 0 4px;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.sel{outline:2px solid var(--ink)}
.card.is-done{background:var(--hold-bg);border-color:var(--line);opacity:.82}
.card.is-done .title{color:var(--muted)}
.top{display:flex;align-items:flex-start;gap:10px}
.top input{margin-top:5px;width:18px;height:18px;flex:none}
.title{font-weight:700;font-size:15.5px;line-height:1.4;color:var(--fg)}
.title small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-done{background:var(--done-bg);color:var(--done)} .b-wait{background:var(--wait-bg);color:var(--wait)}
.b-work{background:var(--work-bg);color:var(--work)} .b-draft{background:var(--draft-bg);color:var(--draft)}
.b-ready{background:var(--ready-bg);color:var(--ready)} .b-idea{background:var(--idea-bg);color:var(--idea)} .b-hold{background:var(--hold-bg);color:var(--hold)}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.steps span{border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.next{font-size:13.5px}
.next b{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.links a{color:var(--work);text-decoration:none}
.links a:hover{text-decoration:underline}
.meta{font-size:12px;color:var(--muted)}
.foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-size:12.5px}
.count{font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
</style>
</head>

const NAMES={done:"발행완료",wait:"발행대기",work:"작업중",draft:"초안대기",ready:"조사완료",hold:"보류",idea:"글감"};
const STEPS=["조사","도해","검토","초안","에디터","예약","발행"];
let filter="all"; let sel={};
try{ sel=JSON.parse(localStorage.getItem("gugu_sel")||"{}"); }catch(e){ sel={}; }
function render(){
  const g=document.getElementById("grid"); g.innerHTML="";
  const list=ITEMS.filter(i=>filter==="all"||i.st===filter);
  document.getElementById("count").textContent=list.length+" / "+ITEMS.length+"건";
  for(const i of list){
    const c=document.createElement("div"); c.className="card"+(sel[i.id]?" sel":"")+(i.st==="done"?" is-done":""); c.dataset.id=i.id;
    const steps=STEPS.map((s,k)=>`<span class="${k<i.step?"on":""}">${s}</span>`).join("");
    const links=i.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("");
    c.innerHTML=`<div class="top"><input type="checkbox" ${sel[i.id]?"checked":""} aria-label="선택"><div class="title">${i.t}<small>${i.s}</small></div></div>
      <div><span class="badge b-${i.st}">${NAMES[i.st]}</span> <span class="meta">${i.date}</span></div>
      <div class="steps">${steps}</div>
      <div class="next">${i.next}</div>
      <div class="links">${links}<span class="meta">📁 ${i.folder}</span></div>`;
    c.querySelector("input").addEventListener("change",e=>{ sel[i.id]=e.target.checked; try{localStorage.setItem("gugu_sel",JSON.stringify(sel));}catch(_){ } c.classList.toggle("sel",e.target.checked); });
    g.appendChild(c);
  }
}
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filter=b.dataset.f; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); render();
});
render();
</script>
