<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NK';src:url('file:///C:/Windows/Fonts/NotoSansKR-VF.ttf');font-weight:100 900}

 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

.cb .m{position:absolute;left:0;right:0;bottom:-60px}</style></head><body class="dots"><div class="stage"><div class="card ab" style="inset:0;padding:40px">

const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);

const s=P(t,1.4,1.7);$('#doc').style.opacity=s;$('#doc').style.transform=`scale(${1.5-.5*s}) rotate(-8deg)`;$('#rg').style.opacity=P(t,1.6,1.9);
const b=P(t,2.0,2.6);$('#j7').style.height=(153*.27*b)+'px';$('#jv7').textContent=b>0?num(Math.round(153*b))+'건':'';
$('#ten').style.opacity=P(t,2.8,3.2)}</script></body></html>
