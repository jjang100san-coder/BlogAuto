<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NK';src:url('file:///C:/Windows/Fonts/NotoSansKR-VF.ttf');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1E2330;--ink2:#4A5163;--muted:#8A8F9C;--line:#E7E1D6;
 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}
html,body{width:1350px;height:1338px}
body{font-family:'NK',sans-serif;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:70px;right:70px;top:250px;bottom:263px}
.card{background:var(--card);border-radius:30px;box-shadow:0 2px 0 rgba(30,35,48,.04),0 16px 40px rgba(30,35,48,.09);border:1px solid #EFE9DF}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 22px;font-weight:800}
.big{font-weight:900;letter-spacing:-.03em;line-height:1}
.mut{color:var(--muted)}
.ab{position:absolute}
.icon3d{object-fit:contain;filter:drop-shadow(0 14px 18px rgba(30,35,48,.16))}
svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{background-image:radial-gradient(#E9E2D5 1.6px,transparent 1.6px);background-size:26px 26px}
.lk{display:flex;align-items:center;gap:20px;padding:30px 36px;font-size:46px;font-weight:900;width:640px}</style></head><body class="dots"><div class="stage" style="display:flex;align-items:center;justify-content:center;gap:60px"><img class="icon3d" id="mg" src="icons/mag_t.png" style="height:400px"><div style="display:flex;flex-direction:column;gap:24px"><div class="card lk" id="k0"><svg class="i" viewBox="0 0 24 24" style="width:50px;height:50px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>금이 갔는지</span></div><div class="card lk" id="k1"><svg class="i" viewBox="0 0 24 24" style="width:50px;height:50px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>가운데가 처졌는지</span></div><div class="card lk" id="k2"><svg class="i" viewBox="0 0 24 24" style="width:50px;height:50px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>조각이 떨어져 있는지</span></div><div class="pill" id="sg" style="background:var(--ink);color:#fff;font-size:36px;align-self:flex-start">보이면 관리자·안전신문고</div></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function F(t){$('#mg').style.transform=`rotate(${-10+Math.sin(t*1.6)*8}deg) translateY(${(1-P(t,.1,.6))*200}px)`;
for(let i=0;i<3;i++){const v=P(t,.6+i*.5,.9+i*.5);$('#k'+i).style.opacity=v;$('#k'+i).style.transform=`translateX(${(1-v)*120}px)`}
$('#sg').style.transform=`scale(${K(P(t,2.4,2.8))})`}</script></body></html>
