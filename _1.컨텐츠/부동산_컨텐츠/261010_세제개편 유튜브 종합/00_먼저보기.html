const SYN_MD = "# 8·3 세제개편 — 유튜브 17편 사실 기준 종합\n\n- 기준일 2026-10-10 · 영상 업로드 09-10 ~ 10-09(최신 위주) · 17편 합계 조회 약 151만\n- **방법**: 17편 **전체 자막을 처음부터 끝까지 읽고** 주장 107건을 시각·화자 단위로 뽑았다. 각 주장을 [03_기준사실표_정부발표.md](03_기준사실표_정부발표.md)(8/3 원안·9/1 수정안·10/1 시행령·국회 일정, 언론 보도 확인)와 대조했다. 숫자는 직접 다시 계산했다.\n- **등급**: 🟢 기준 일치 51 · 🟡 부분·누락 13 · 🔴 틀림·확인불가 9 · ⚪ 기준 밖 14 · ⚪ 의견·전망 20\n- 요청대로 **긍정·부정 평가는 판단 근거에서 뺐다.** \"소급 증세다\", \"집값 잡으려는 꼼수다\", \"팔지 마라\" 같은 말은 ⚪ 의견으로 분류만 하고 결론에 쓰지 않았다.\n- 세무 상담이 아니다. 법률 사항은 아직 국회를 통과하지 않았다.\n\n---\n\n## 0. 결론 먼저 — 지금 어떤 결로 가고 있나\n\n### 0-1. 방향은 하나다: \"주택 수·보유\" → \"주택 가액·거주\"\n\n8/3 원안의 설계 원칙은 9/1 수정안과 10/1 시행령을 거친 뒤에도 바뀌지 않았다. 숫자 몇 개만 되돌아갔다.\n\n| 구분 | 항목 | 8/3 원안 | 지금(9/1 수정안·10/1 시행령) | 결 |\n|---|---|---|---|---|\n| ↩️ **되돌린 것** | 비거주 1주택 종부세 기본공제 | 12억→9억 | **12억 유지** | 완화(원상복구) |\n| ↩️ | 종부세 세부담 상한 | 150%→200% | **150% 유지** | 완화(원상복구) |\n| ↩️ | 비거주 부부 공동명의 1인 공제 | 9억→4억 | **6억** | 일부 완화 |\n| ⬆️ **강화 그대로** | 공정시장가액비율 | 60% | 2027년 70%, 3주택 이상·조정지역 2028년 80% | 강화 |\n| ⬆️ | 종부세 세율 | 주택 수별 | 2028년 주택 수 무관 0.5~5.0% 7단계(현행 3주택 이상 세율표와 같은 범위) | 1·2주택 고가는 강화 |\n| ⬆️ | 다주택 기본공제 | 9억 | 4억 + 5억×(거주주택 가액÷합계) | 강화 |\n| ⬆️ | 장특공 → 장기거주소득공제 | 보유 4%+거주 4% | 2028년 보유 2%·거주 6%, 한도 20억 → 2029년 거주 8%만, 한도 10억 | 비거주·초고가 강화 |\n| ⬆️ | 조정 일시적 2주택 처분기한 | 3년 | **2년(10/1 시행)** | 강화 |\n| ⬆️ | 조정 매입임대 아파트 중과배제 | 기한 없음 | **2027.12.31 양도분까지(10/1 시행)** | 강화 |\n| ⬆️ | 상생임대 특례 | — | **2026년 말 종료(10/1 시행)** | 종료 |\n| ⬇️ **새로 푼 것** | 다주택 양도세 중과 | +20/+30%p | 2027년 +5/+10, 2028년 +10/+15, 2029년 복귀 | 한시 완화(매도 유도) |\n| ⬇️ | 10년 거주·30억 이하 1주택 양도 기본공제 | 250만 | 2,500만 | 완화 |\n| ⬇️ | 실거주 1주택 종부세 기본공제 | 12억 | 14억 | 완화 |\n\n**사실로 정리하면 이렇다.** 실거주 1주택은 공제를 늘려 보호한다. 비거주·다주택·초고가는 보유세(공정시장가액비율·세율)와 양도세(거주 중심 공제·한도)로 부담을 늘린다. 그 대신 다주택자에게는 2027~28년 2년 동안 중과를 낮춰 \"팔 창구\"를 열었다. 9/1 수정안은 여론이 가장 컸던 **비거주 1주택 종부세 두 숫자만** 되돌렸다. 영상 17편 중 이 구조를 부정하는 사실 주장은 없었다.\n\n### 0-2. 단계가 다르다: \"이미 시행\"과 \"국회 대기\"\n\n| 상태 | 항목 | 근거 |\n|---|---|---|\n| ✅ **10/1부터 시행 중**(시행령, 9/29 국무회의) | 일시적 2주택 2년 · 매입임대 아파트 기한 · 상생임대 종료 · 거주주택 비과세 5년 유지 | 기준표 4 |\n| 📋 **국회 제출, 미통과**(법률, 9/3 제출) | 종부세 전부 · 장특공 개편·한도 · 다주택 중과 한시 완화와 5/10 이후 양도분 환급 · 임대 1~2년 구간 단계 폐지(조특법) | 기준표 2·3 |\n| ⏳ **다음 일정** | 여당은 종부세 정부안 유지 방침(9/20 보도), 양도세는 **11월 조세소위** 논의 예정 · 10/6 국감에서 부총리가 \"과표 정상화\"를 언급 | 기준표 5 |\n\n> 영상 제목의 \"결국 확정\"은 대부분 **9/1 국무회의 확정(=정부안 확정)**을 뜻한다. 법이 확정됐다는 뜻이 아니다. 이 둘을 구분해 말한 영상은 박병찬(10/9), 부동산쇼(10/4), 이승희(10/5) 세 편이다.\n\n### 0-3. 달력으로 보면\n\n| 날짜 | 일어나는 일 | 상태 |\n|---|---|---|\n| 2026-11-09 | 2025.10 신규 조정지역(서울 21개 구·경기 12곳)의 5/9 이전 계약분 중과 배제 경과조치 끝 | ✅ |\n| 2026-12-31 | 상생임대 특례 종료 · 2026년 고지 종부세는 **현행법** | ✅ |\n| 2027년 | 종부세 새 공제(거주 14억·비거주 12억)·공정시장가액비율 70% 적용 예정 · 다주택 중과 +5/+10%p · 장특공은 현행 유지 · 매입임대 아파트 중과배제 마지막 해 | 📋/✅ |\n| 2028년 | 종부세 단일세율·3주택 이상 80% · 장특공 보유 2%/거주 6%·한도 20억 · 중과 +10/+15%p | 📋 |\n| 2029년~ | 장특공 거주 8%만·한도 10억 · 중과 원상복구(+20/+30%p) · 상생임대 거주요건 면제 최장 시한 | 📋/✅ |\n\n---\n\n## 1. 어떤 영상을 봤나\n\n**선정**: 검색어 12개(8.3 세제개편, 부동산 세제개편안, 세제개편 수정안, 종부세 개편, 장특공 개편, 다주택자 양도세 중과, 임대사업자 세제 개편, 세법개정안 부동산 등)를 \"이번 달 · 최신순\"과 \"이번 달 · 조회수순\"으로 돌려 후보 205편을 모았다. 그중 **최신 위주**로 고르되 9/1 수정안 이후의 큰 조회 영상을 함께 넣었다. 뉴스·국회 원본 클립도 섞었다. 결과는 17편이다.\n\n| 번호 | 업로드 | 채널 | 성격 | 조회 | 🟢/🟡/🔴 |\n|---|---|---|---|---|---|\n| 01 | 10-09 | 박병찬의 부자병법 | 전문가 강의(다주택) | 2.0만 | 8 / 2 / 0 |\n| 02 | 10-06 | 밥소장 부자연구소 | 내레이션(LH 종부세) | 67 | 0 / 0 / 3 |\n| 03 | 10-05 | 국회 그대로 | 국회 클립(9/28 재경위) | 0.2만 | 1 / 1 / 0 |\n| 04 | 10-05 | 세계일보 | 인터뷰(9/15 녹화) | 5.7만 | 2 / 1 / 0 |\n| 05 | 10-05 | 씨더택스 | 세무 카드(11/9 경과조치) | 676 | 4 / 0 / 0 |\n| 06 | 10-05 | 싹풀TV 이승희세무사 | 세무사 해설 | **42.5만** | 6 / 2 / 1 |\n| 07 | 10-04 | 부동산쇼 | 해설(공포 법령 화면) | 6.5만 | 6 / 0 / 0 |\n| 08 | 10-02 | 이상우 부동산 애널리스트 | 단독 강의 | 4.5만 | 1 / 2 / 1 |\n| 09 | 10-01 | 딜라이브 뉴스 | 지역 뉴스(강남구 건의) | 3.9만 | 0 / 0 / 0 |\n| 10 | 10-01 | 세무짱TV | 세무사 해설(시행일) | 0.5만 | 4 / 1 / 0 |\n| 11 | 09-30 | SBS Biz | 뉴스(시행령 의결) | 10.6만 | 3 / 1 / 0 |\n| 12 | 09-28 | MBN | 뉴스(다소유자 최저) | 6.0만 | 0 / 1 / 0 |\n| 13 | 09-22 | 채널 제네시스박 | 라이브(장특공 한도 계산) | 10.9만 | 5 / 0 / 0 |\n| 14 | 09-14 | KBS | 자막뉴스(국세청 공동명의) | 1.5만 | 0 / 1 / 0 |\n| 15 | 09-14 | SBS | 뉴스(재경부 종부세 추산) | 18.3만 | 2 / 1 / 0 |\n| 16 | 09-10 | 세금아는동생 | 세무사 시뮬레이션 | 11.0만 | 7 / 0 / 0 |\n| 17 | 09-10 | 표영호tv(문재완 세무사) | 대담(수정안 직후) | **27.0만** | 2 / 0 / **4** |\n\n---\n\n## 2. 항목별로 영상들이 맞게 말했나\n\n### 2-1. 종부세\n\n- **9/1 수정안 숫자(거주 14억·비거주 12억·상한 150%)**: 06·07·13·15·16·01이 정확하다. **17(표영호tv)은 한 대담 안에서 세 번 다르게 말했다.** 세무사는 처음에 \"12억 원복\"이라고 했다가 08:33에서 \"10억으로 원복, 상한 200→150→다시 200\"이라고 했다. 진행자는 09:33에서 \"150→200→150\"이라고 바르게 말했다. 사실은 **12억, 150% 유지**다.\n- **비거주 공동명의 1인 6억**: 기준표의 보도 1건에 더해 06(이승희)이 독립적으로 같은 숫자를 말했다. 두 출처가 일치한다.\n- **공제가 그대로인데 왜 오르나**: 15(SBS, 재경부 국회 제출 자료)가 답을 화면으로 보여 줬다. 비거주 공시 15억은 69.1만→80.6만, 20억은 227.5만→277.4만, 30억은 774.7만→1,203.8만(+429만)이다. 원인은 **공정시장가액비율 60→70%와 일부 세율 인상**이다. 9/1에 되돌린 것은 공제와 상한뿐이라 이 둘은 남아 있다. 세액공제·상한을 적용하기 전 금액이다.\n- **2028년 단일세율**: 01(박병찬)은 \"1·2주택 세율을 3주택 이상 수준으로 맞추는 것\"이라고 했다. 0.5~5.0%라는 범위는 현행 3주택 이상 세율표와 같다. 현행 2주택 이하는 0.5~2.7%다. **방향 설명으로 사실과 맞다.**\n- **\"5년 뒤 보유세 9배\"(17)**: 매년 150% 상한이 걸리면 5년 동안 최대 1.5⁵ ≈ **7.6배**다. 개별 주택의 상한 구조로는 9배가 나올 수 없다. 9배는 KB 보고서의 '2030년 종부세 총액 8.9배'(신규 과세 단지 포함 합계)와 섞인 숫자로 보인다. 🔴로 표시했다.\n\n### 2-2. 장특공(장기거주소득공제)\n\n- 연도별 공제율과 한도(2028년 20억, 2029년 10억)는 06·13·04·17·16·01이 모두 맞게 말했다.\n- **가장 흔한 오해는 \"한도가 무엇에 걸리나\"다.** 사실은 이렇다: 12억 초과분 안분 → 과세대상 양도차익 → 공제율 적용 → **그 공제 금액**에 한도.\n  - 13·04(제네시스박)는 이 순서로 계산했고, 재계산 결과 모두 맞다. 10억→40억이면 과세차익 21억이고, 80%를 적용하면 16.8억이라 2029년 한도 10억에 걸린다. 40%면 8.4억이라 걸리지 않는다. 2029년 한도 영향이 시작되는 지점은 과세차익 12.5억이다.\n  - 06(이승희)의 50억→80억 예시는 12억 비과세 안분을 빠뜨렸다. 그래서 과세분이 20억으로 나왔다. 실제 1세대 1주택이면 25.5억×80% = 20.4억 → 한도 10억 → **과세 15.5억**이다.\n  - 17의 진행자는 \"양도세 면제를 10억까지만 해 준다\"고 했다. 이는 비과세 기준(12억, 변동 없음)과 공제 한도(10억)를 혼동한 것이다.\n- **경과조치 없음**: 한도는 \"취득일\"이 아니라 \"양도일\" 기준이다. 따로 정한 경과조치가 없다는 보도(에너지경제 8/3)와 13의 설명이 일치한다. 강남구의 경과조치 건의(09)와 국민동의청원 5만 명(13, 기사 인용·원문 미확인)은 이 지점을 겨냥한 요구다. 정부안은 아직 바뀌지 않았다.\n\n### 2-3. 다주택 양도세 중과 한시 완화\n\n- 연도별 가산세율(5/10·10/15·20/30)은 01·06·16·03이 모두 일치한다.\n- 16(세금아는동생)의 세액 시뮬레이션은 직접 다시 계산했고 6건이 모두 맞다. 2주택·차익 10억 기준 2029년 6.41억, 2028년 5.31억, 2027년 4.76억이다. 3주택은 7.51억에서 5.31억으로 줄어 2.19억이 차이 난다.\n- **5/10 이후 이미 중과로 낸 양도분도 2027년 5월 확정신고 때 환급**(보유 2년 이상)한다는 계획은 16만 말했고, 기준표(뉴시스)와 일치한다. 국회 통과가 전제다.\n- 03(국회 9/28)에서 의원은 \"다시 유예했다\"고 했고, 부총리는 \"유예가 아니라 중과 완화\"라고 답했다. **사실관계는 부총리 쪽이 맞다.** 중과를 아예 안 매기는 것이 아니라 가산세율을 낮추는 것이다.\n- 완화 기간에도 **장특공은 배제된다**(16·기준표).\n\n### 2-4. 10/1 시행령(이미 시행)\n\n- 일시적 2주택 2년은 11·10·01·08이 맞게 말했다. **\"종전·신규가 모두 조정지역일 때만\"이라는 요건까지 말한 것은 10·01·08이다.** 11(SBS Biz)은 이 요건을 빼고 말했다.\n- **매입임대 아파트 기한의 대상 범위에서 영상들이 갈린다.**\n  - 07(부동산쇼)은 공포 법령 화면을 보여 주며 \"자동말소되는 **조정지역 매입임대 아파트**만\"이라고 했다. 11·10도 같다. 기준표와 일치한다.\n  - 08(이상우)은 \"조정지역과 상관없이 등록임대 어디나 적용\"이라고 하며 포항·여수·원주의 매물 폭탄을 예로 들었다. **사실과 다르다.** 비아파트, 조정지역 밖 아파트, 건설·공공지원 임대는 특례가 유지된다.\n  - 01(박병찬)은 기한은 맞게 말했지만 '아파트'라는 한정을 빼먹었다.\n- 07은 **시행령(1년 기한, 시행 중)과 조특법(1~2년 구간 장특공 30%·중과 절반, 국회 미통과)**을 구분했다. 이 부분은 17편 중 가장 정밀하다.\n- 거주주택 비과세 5년 유지와 상생임대 종료 후 1년 유예는 07·10·01이 일치한다.\n\n---\n\n## 3. 영상 간 충돌과 판정\n\n| 쟁점 | A | B | 판정(기준표) |\n|---|---|---|---|\n| 비거주 공제 원복 숫자 | 17 08:33 \"10억\" | 06·15·17 01:50 \"12억\" | **12억** |\n| 세부담 상한 경과 | 17 08:33 \"150→200→200\" | 17 09:33·15 \"150→200→150\" | **150% 유지** |\n| 등록임대 기한 범위 | 08 \"어디나, 지방 포함\" | 07·11·10 \"조정 매입임대 아파트만\" | **조정 매입임대 아파트만** |\n| 장특공 한도의 대상 | 17 \"양도세 면제 10억까지\" | 13·04 \"공제 금액에 한도\" | **공제 금액** |\n| 장특공 한도 예시 | 06 \"과세 20억\" | (재계산) | **15.5억**(1세대 1주택, 비과세 안분) |\n| 중과 '유예' vs '완화' | 03 의원 \"다시 유예\" | 03 부총리·16 \"완화\" | **완화**(가산세율 인하) |\n| 보유세 증가 배수 | 17 \"5년 9배\" | (계산) 상한 150%면 5년 최대 7.6배 | 개별 주택으로는 **불가능한 수치** |\n\n---\n\n## 4. 시장·행정 쪽 사실(정책 효과 판단 재료)\n\n- **다주택 비율**: 8월 집합건물 다소유자 지수가 16.019로, 2018년 11월 이후 7년 9개월 만에 최저다(12 MBN, 등기정보광장). 다만 **집합건물만 센 통계**이고 단독주택은 빠져 있다. 원인(중과 부활·세제 우려)은 보도의 해석이며, 통계로 증명된 인과관계는 아니다.\n- **국세청 공동명의 안내**: 현행 2026년 고지분 기준으로 부부 공동명의 1주택 특례 선택을 국세청이 대신 계산했다. 8,600명에게 9/15~17 안내했고, 과다 납부분은 환급한다(14 KBS). 공시 20.5억 이하면 각자 내는 쪽이 유리하다.\n- **강남구 건의**(09): 단기 보유자 경과규정, 재건축 이주기간의 거주 인정, 고령자 납부유예 요건 완화, 공제 한도 재점검, 기존 취득분 경과조치를 건의했다. 정부가 받아들였는지는 확인되지 않았다.\n- **확인되지 않은 것**: 02의 \"LH 등 공공기관 종부세 600억→843억\"은 출처를 밝히지 않았고, 웹 검색에서도 찾지 못했다. LH 국감은 10/12 예정이라 10/6 업로드와 시점도 맞지 않는다. 인용하면 안 된다.\n\n---\n\n## 5. 아직 모르는 것 (확인 대기)\n\n1. **양도세(장특공·한도) 국회 수정 여부**: 11월 조세소위에서 논의 예정이다. 경과조치나 보유 공제 일부 존치(이중교 교수 '보유 20%·거주 60%' 제안 기사)가 들어갈지는 미정이다.\n2. **비거주 공동명의 1인 6억**: 보도 1건과 영상 1편이 일치하지만 법안 원문은 대조하지 못했다.\n3. **\"과표 정상화\"의 구체안**: 10/6 국감 발언뿐이다. 공정시장가액비율 추가 인상 계획은 발표된 것이 없다.\n4. **조특법 임대 단계 폐지(1~2년 구간)**: 국회 통과 전이다.\n5. **청원(장특공 한도 철회 5만 명)**: 영상 화면의 기사 인용뿐이고 청원 원문은 확인하지 못했다.\n\n---\n\n## 6. 블로그로 옮길 때 (뜻 기준)\n\n- **[세제 정리] 8·3 세제개편, 9/1에 되돌린 것 3개와 그대로 간 것 10개** — 0-1 표를 쓴다. 시행령과 법률을 색으로 나눈다.\n- **[계산] 장특공 10억 한도, 내 집은 걸릴까 — 양도차익이 아니라 공제액** — 13의 계산 순서와 2-2의 재계산을 쓴다. 06·17의 흔한 오해를 사례로 든다. 계산 카드는 자체 제작한다.\n- **[달력] 2026년 11월 9일부터 2029년까지 부동산 세금 날짜표** — 0-3 표를 쓴다.\n- **[다주택] 2027년에 팔면 얼마 줄어드나 — 차익 10억 시뮬레이션** — 16의 숫자(재계산 일치)를 쓴다. 국회 미통과 전제를 명시한다.\n- 주의: 영상 프레임은 쓰지 않는다. 숫자는 이 문서와 기준표에서 옮긴다. 상담 전화번호·멤버십 링크는 옮기지 않는다.\n\n---\n\n## 7. 한계\n\n- 기준표는 **언론 보도로 확인한 2차 사실**이다. 재정경제부 보도자료 원문, 국회 의안 원문, 법제처 시행령 공포문은 직접 열람하지 못했다. 07의 화면에 시행령 공포문이 나오기는 했다.\n- 영상 17편은 후보 205편 중 최신순 위주로 고른 것이다. 9월 초의 대형 조회 영상(김작가 TV 24.5만, 두꺼비 세무사 26.7만·21.7만, 부읽남 19.6만 등)은 빠졌다. 제목으로 보면 대부분 9/1 수정안 직후의 전망 대담이다(내용은 보지 않았다).\n- 모두 1순위(로컬) 추출이고 유료 호출은 0회다. 자막의 고유명사는 화면과 대조해 고쳤다(영상별 `대조_*.md`의 🚫 항목).\n";
const NUMS_MD = "# 8·3 세제개편 — 기준 사실표 (정부 발표·수정안·시행령·국회)\n\n영상 속 주장을 대조할 **기준선**이다. 언론 보도로 확인된 사실만 적었다. 의견·전망·평가는 넣지 않았다.\n수집일 2026-10-10. 출처는 맨 아래에 있다. **원문 보도자료와 법안 조문은 직접 확인하지 못했다.** 아래 내용은 모두 언론 보도를 거친 2차 확인이다.\n\n- **상태 표기**: ✅ 시행 중 · 📋 국무회의 의결·국회 제출(미확정) · ↩️ 수정안에서 철회·변경 · ⏳ 국회 논의 예정\n\n---\n\n## 1. 절차 타임라인\n\n| 날짜 | 사건 | 상태 |\n|---|---|---|\n| 2025-10-15 | 서울 전역·경기 12곳 조정대상지역·토지거래허가구역 지정(10·15 대책), 10/16 시행 | ✅ |\n| 2026-05-09 | 다주택자 양도세 중과 유예 종료 → 5/10 양도분부터 중과(2주택 +20%p, 3주택 이상 +30%p) 재적용 | ✅ |\n| 2026-08-03 | 재정경제부 「2026년 세제개편안」 발표(세제발전심의위원회). 11개 세법 개정안, 5년간 세수 +3조 4,430억 원(전체 기준) | 📋 |\n| 08-04 ~ 08-20 | 입법예고 | — |\n| 08-27 | 차관회의 | — |\n| 09-01 | 국무회의에서 **수정안 확정**(원안 발표 29일 만) | 📋 |\n| 09-03 | 국회 제출 | 📋 |\n| 09-29 | 국무회의에서 소득세법·법인세법·종부세법·상증세법 **시행령 4건 의결** | ✅ |\n| 10-01 | 시행령 시행(일시적 2주택·등록임대 아파트·상생임대) | ✅ |\n| 10-06 | 국정감사(재정경제기획위원회, 재정경제부). 이형일 부총리 답변 | — |\n| 11월 | 조세소위에서 양도세(장특공) 본격 논의 예정(보도) | ⏳ |\n| 11-09 | 2025.10 신규 조정대상지역 경과조치(중과 배제) 최종 기한(보도) | ✅ |\n\n> 법률 사항(종부세 공제·세율, 장특공, 다주택 중과 한시 완화)은 **아직 국회를 통과하지 않았다.** 시행령 사항(일시적 2주택·등록임대·상생임대)은 **10/1부터 이미 시행 중**이다. 영상들이 \"확정\"이라고 할 때 어느 쪽을 말하는지 구분해야 한다.\n\n---\n\n## 2. 종합부동산세 (법률 사항, 2027년부터 적용 예정)\n\n| 항목 | 현행 | 8/3 원안 | 9/1 수정안 |\n|---|---|---|---|\n| 1세대 1주택 **거주** 기본공제 | 12억 | 14억 | 14억 (유지) |\n| 1세대 1주택 **비거주** 기본공제 | 12억 | **9억** | ↩️ **12억**(현행 유지) |\n| 비거주 부부 공동명의 1인당 공제 | 9억 | 4억 | ↩️ 6억 (보도 1건, 추가 확인 필요) |\n| 다주택 기본공제 | 9억 | 4억 + 5억 × (거주주택 가액 ÷ 합계) | 원안 유지(보도) |\n| 세부담 상한 | 150% | 200% | ↩️ **150%**(현행 유지) |\n| 공정시장가액비율 | 60% | 2027년 70%(1주택·지방 1~2주택 등), 3주택 이상·조정 2028년 80% | 원안 유지 |\n| 세율 체계 | 주택 수별 | 2027년 중간 단계 → **2028년 주택 수 무관 7단계 0.5~5.0%** | 원안 유지 |\n| 1주택 세액공제(연령·거주) | 합산율 한도 80% | 80% 유지 + 공제액 한도 2027년 800만 원, 2028년 600만 원 | 원안 유지(보도) |\n| 적용 | — | 2027년 납세의무 성립분부터. **2026년 12월 고지분은 현행법** | — |\n\n## 3. 양도소득세 (법률 사항)\n\n**3-1. 장기보유특별공제 → 주택은 '장기거주소득공제'로**\n\n| 구분 | 현행(~2027) | 2028년 | 2029년 이후 |\n|---|---|---|---|\n| 1세대 1주택 | 보유 연 4% + 거주 연 4%, 최대 80% | 보유 연 2% + 거주 연 6% | 보유 폐지, **거주 연 8%**, 최대 80% |\n| 공제 금액 한도 | 없음 | **20억** | **10억** |\n| 비조정 다주택 | 보유 연 2%, 최대 30% | 보유 1%·거주 2% 중 높은 쪽 | 거주 연 2%, 최대 30% |\n| 조정 다주택(중과 대상) | 배제 | 배제 | 배제 |\n| 비주택(상가 등) | — | '장기보유소득공제', 보유 기준 유지 | 〃 |\n\n- 공동명의는 지분 비율로 한도를 나눈다. 부부가 반반이면 2028년 각 10억, 2029년 이후 각 5억이다.\n- 10년 이상 거주한 양도가 30억 이하 1세대 1주택은 기본공제 연 250만 → **2,500만 원**.\n- 보도 예시: 25억에 사서 75억에 판 10년 보유·거주 → 산출세액 2027년 3억 1,600만 / 2028년 9억 2,300만 / 2029년 13억 7,300만.\n- 9/1 수정안에서 바뀌지 않았다. 9/20 보도에 따르면 여당은 종부세는 정부안을 유지하고, 양도세는 **11월 조세소위**에서 논의할 예정이다.\n\n**3-2. 다주택자 중과 한시 완화 (조정대상지역)**\n\n| 구분 | 현행(5/10~) | 2027년 | 2028년 | 2029년~ |\n|---|---|---|---|---|\n| 2주택 | +20%p | **+5%p** | +10%p | +20%p |\n| 3주택 이상 | +30%p | **+10%p** | +15%p | +30%p |\n\n- 2026년 5/10 이후 중과세율로 낸 양도분에도 2027년 세율을 적용하고, **2027년 5월 확정신고 때 환급**한다는 계획이다(정부안).\n- 세율이 완화돼도 장특공은 적용되지 않는다.\n- 10/3·10/5 국회 영상의 부총리 발언: \"유예를 다시 한 게 아니다, 중과 완화\"(영상 대조 대상).\n\n## 4. 시행령 — 10월 1일 시행 ✅\n\n| 항목 | 내용 |\n|---|---|\n| 조정대상지역 일시적 2주택 | 종전 주택 처분 기한 **3년 → 2년**. 종전·신규 주택이 **모두 조정대상지역**일 때만. 2026.8.4 이후 신규 취득 + 10/1 이후 종전 양도분부터. 8/3까지 취득·계약금 지급분은 3년. 종부세는 시행일 이후 납세의무 성립분부터 |\n| 조정 매입임대 **아파트** 중과배제 | 등록말소 뒤 기한 없이 적용되던 중과배제·법인세 추가과세 배제가 **2027.12.31 양도분까지**로 끝난다. 비아파트·조정 밖 아파트·건설임대·공공지원은 유지 |\n| 〃 예외 | 2027.1.1 기준 의무임대기간이 남은 주택은 말소일부터 1년. 2027년 이후 새로 조정지역이 된 곳은 지정 공고일부터 1년. 재건축·재개발은 이전고시일부터 1년. 여럿에 해당하면 가장 늦은 날 |\n| 임대사업자 **거주주택** 비과세 | 유지. 12억 이하 비과세, 장특공 최대 80%, 말소일부터 5년 |\n| 상생임대 특례 | **2026년 말 종료**. 상생임대 종료 후 1년 안에 양도해야 2년 거주요건이 면제된다 |\n| 8/3 원안의 단계 폐지안 | 2027년 중과배제 유지·공제율 50% → 2028년 중과 절반·공제율 30% → 이후 전면 중과(원안 보도). 최종 시행령과 문구 대조 필요 |\n\n## 5. 국회·국감 (10월)\n\n- 10/6 국감에서 이형일 부총리가 답변했다. 종부세·양도세는 \"공정과세 차원\"에서 접근한다고 했다. 종부세 과표가 공정시장가액비율 때문에 실질 40%대이며 예전에는 약 80%였다며, \"과표 정상화\"를 고민한다고 했다. 양도세는 12억 이하 비과세와 장특공 때문에 2024년 과세 비율이 약 16%라고 했다. 비거주 1주택 세 부담은 연말 세법 논의에서 다루겠다고 했다.\n- 다주택자 양도세에 대해서는 \"기한 내 매도의 현실적 어려움이 있으면 살펴보겠다\"고 했다.\n- 9/15 이형일 부총리 후보자 인사청문회에서 부동산 세제 보완 방안이 질의됐다(영상 대조 대상).\n\n## 6. 시장 통계 (사실)\n\n- 대법원 등기정보광장(9월 말 공개) 기준 **8월 집합건물 다소유자 지수는 16.019**다. 2018년 11월(16.015) 이후 7년 9개월 만에 최저다. 2채 보유 11.083, 3채 보유 2.514다. **집합건물만 센 통계이며 단독주택은 빠져 있다.**\n\n---\n\n## 출처\n- 8/3 원안: [뉴시스 8/3](https://www.newsis.com/view/NISX20260803_0003733686) · [일간NTN](https://www.intn.co.kr/news/articleView.html?idxno=2052313) · [에너지경제 장특공](https://www.ekn.kr/web/view.php?key=20260803025529120) · [KB Think](https://kbthink.com/goldenlifex/tax-and-law/housing-tax-reform-2026.html)\n- 9/1 수정안: [뉴스토마토](https://www.newstomato.com/ReadNews.aspx?no=1312222) · [오마이뉴스](https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003263697) · [네이트 9/1](https://m.news.nate.com/view/20260901n39102)\n- 10/1 시행령: [아이뉴스24](https://www.inews24.com/view/2010025) · [다음 9/30](https://v.daum.net/v/20260930043533677) · [서울파이낸스](https://www.seoulfn.com/news/articleView.html?idxno=638889)\n- 국회·국감: [서울경제 9/20](https://m.sedaily.com/article/20093126) · [파이낸셜뉴스 10/6](https://www.fnnews.com/news/202610061843193300) · [데일리안 10/6](https://www.dailian.co.kr/news/view/1698296/2026-%EA%B5%AD%EA%B0%90-%EC%A2%85%EB%B6%80%EC%84%B8-%EC%98%81%ED%96%A5-%EB%B6%84%EC%84%9D-%EB%8F%84%EB%A7%88-2026)\n- 종부세 세율 체계: [조상현 정리](https://chosanghyun.com/guide/%EC%A2%85%EB%B6%80%EC%84%B8-%EA%B0%9C%ED%8E%B8-%EC%B4%9D%EC%A0%95%EB%A6%AC) · [다음 1.7조](https://v.daum.net/v/fbZSCwu5rv)\n- 다소유자 지수: [SBS Biz](https://biz.sbs.co.kr/amp/article/20000336877) · [경북매일](https://kbmaeil.com/article/20260928500039)\n- 원문 확인처: 국가전략포털 [2026년 세제개편안 상세본](https://nsp.nanet.go.kr/plan/subject/detail.do?nationalPlanControlNo=PLAN0000065941), 국회 의안정보시스템(종합부동산세법·소득세법 일부개정법률안), 국가법령정보센터(소득세법 시행령 제155조·제167조의3 부칙)\n";

function inline(s){

  return s;
}
function md(src){
  const L = src.replace(/\r/g,"").split("\n"); let o=[], i=0;
  while(i<L.length){
    let l=L[i];
    if(/^```/.test(l)){ let b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(esc(L[i++])); i++; o.push("<pre><code>"+b.join("\n")+"</code></pre>"); continue; }
    if(/^#{1,6} /.test(l)){ const n=l.match(/^#+/)[0].length; o.push(`<h${n}>${inline(l.slice(n+1))}</h${n}>`); i++; continue; }
    if(/^---+\s*$/.test(l)){ o.push("<hr>"); i++; continue; }
    if(/^\|/.test(l)){
      let rows=[]; while(i<L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|\s*$/g,"").split("|").map(c=>c.trim());
      let h=cells(rows[0]), body=rows.slice(/^\|[\s:|-]+\|?\s*$/.test(rows[1]||"")?2:1);
      o.push('<div class="tw"><table><thead><tr>'+h.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
        body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");
      continue;
    }
    if(/^> /.test(l)){ let b=[]; while(i<L.length && /^> /.test(L[i])) b.push(inline(L[i++].slice(2))); o.push("<blockquote>"+b.join("<br>")+"</blockquote>"); continue; }
    if(/^\s*([-*]|\d+\.) /.test(l)){
      const ord=/^\s*\d+\./.test(l); let items=[];
      while(i<L.length && (/^\s*([-*]|\d+\.) /.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        const t=L[i++];
        if(/^\s*([-*]|\d+\.) /.test(t)){
          const sub=/^\s{2,}/.test(t); const txt=inline(t.replace(/^\s*([-*]|\d+\.) /,""));
          if(sub && items.length) items[items.length-1]+= "<br>· "+txt; else items.push(txt);
        } else items[items.length-1]+=" "+inline(t.trim());
      }
      o.push((ord?"<ol>":"<ul>")+items.map(x=>"<li>"+x+"</li>").join("")+(ord?"</ol>":"</ul>")); continue;
    }
    if(!l.trim()){ i++; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#|\||> |```|---|\s*([-*]|\d+\.) )/.test(L[i])) p.push(L[i++]);
    o.push("<p>"+inline(p.join(" "))+"</p>");
  }
  return o.join("\n");
}

/* --- 탭 / 테마 --- */
const tabs=[...document.querySelectorAll("nav button[data-tab]")];
function show(t){ tabs.forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on",s.id===t)); try{localStorage.setItem("tax261010-tab",t)}catch(e){} window.scrollTo(0,0); }
tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById("theme").onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); r.dataset.theme = cur==="dark"?"light":"dark"; try{localStorage.setItem("tax261010-theme",r.dataset.theme)}catch(e){} };
try{ const th=localStorage.getItem("tax261010-theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}

/* --- 한눈에 --- */
const C=DATA.claims, V=DATA.videos;
const gcls=g=>g.startsWith("🟢")?"g-g":g.startsWith("🟡")?"g-y":g.startsWith("🔴")?"g-r":g==="⚪ 의견·전망"?"g-a":"g-o";
const gcol={"g-g":"var(--g)","g-y":"var(--y)","g-r":"var(--r)","g-o":"var(--o)","g-a":"var(--ad)"};
const totalViews=V.reduce((a,v)=>a+v.views,0);
const gc={}; C.forEach(c=>gc[c.grade]=(gc[c.grade]||0)+1);
const kp=[[V.length+"편","영상"],[C.length+"건","추출 주장"],[(totalViews/10000).toFixed(0)+"만","합계 조회"],[(gc["🟢 기준 일치"]||0)+"건","기준과 일치"],[(gc["🔴 틀림·확인불가"]||0)+"건","틀림·확인 불가"]];
document.getElementById("kpis").innerHTML=kp.map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join("");
const order=["🟢 기준 일치","🟡 부분·누락","🔴 틀림·확인불가","⚪ 기준 밖","⚪ 의견·전망"];
document.getElementById("gbar").innerHTML=order.map(g=>`<i style="width:${(gc[g]||0)/C.length*100}%;background:${gcol[gcls(g)]}" title="${g} ${gc[g]||0}"></i>`).join("");
document.getElementById("glegend").innerHTML=order.map(g=>`<span><em style="background:${gcol[gcls(g)]}"></em>${g} ${gc[g]||0}</span>`).join("");
const sec0 = SYN_MD.split(/\n## /)[1]||""; document.getElementById("concl").innerHTML = md("## "+sec0.replace(/\n---[\s\S]*$/,""));
document.getElementById("vgrid").innerHTML=V.map(v=>`<div class="v" data-v="${v.no}"><div><span class="no">${v.no}</span><span class="t">${esc(v.channel)}</span></div><div class="m">${esc(v.people)}</div><div class="m">${esc(v.title)}</div><div class="m">${v.date} · ${v.length} · 조회 ${(v.views/10000).toFixed(1)}만 · 주장 ${v.claims}</div><div class="m">${esc(v.kindv)}</div></div>`).join("");
document.querySelectorAll(".v").forEach(el=>el.onclick=()=>{ fv.value=el.dataset.v; ft.value=fg.value=fn.value=""; fq.value=""; render(); show("claims"); });

/* --- 종합 / 숫자 --- */
document.getElementById("synmd").innerHTML=md(SYN_MD);
document.getElementById("numsmd").innerHTML=md(NUMS_MD);

/* --- 주장 탐색 --- */
const fv=document.getElementById("fv"), ft=document.getElementById("ft"), fg=document.getElementById("fg"), fn=document.getElementById("fn"), fq=document.getElementById("fq");
V.forEach(v=>fv.insertAdjacentHTML("beforeend",`<option value="${v.no}">${v.no} ${esc(v.channel)}</option>`));
[...new Set(C.map(c=>c.topic))].sort().forEach(t=>ft.insertAdjacentHTML("beforeend",`<option>${t}</option>`));
order.forEach(g=>fg.insertAdjacentHTML("beforeend",`<option>${g}</option>`));
[...new Set(C.map(c=>c.nature))].forEach(n=>fn.insertAdjacentHTML("beforeend",`<option>${n}</option>`));
const vmap=Object.fromEntries(V.map(v=>[v.no,v]));
function render(){
  const q=fq.value.trim().toLowerCase();
  const r=C.filter(c=>(!fv.value||c.v===fv.value)&&(!ft.value||c.topic===ft.value)&&(!fg.value||c.grade===fg.value)&&(!fn.value||c.nature===fn.value)&&
    (!q||(c.claim+" "+c.nums+" "+c.who+" "+c.note+" "+c.channel+" "+c.topic).toLowerCase().includes(q)));
  document.getElementById("cnt").textContent=r.length+" / "+C.length+"건";
  document.getElementById("clist").innerHTML=r.map(c=>`<div class="c"><div class="h">
    <span class="chip">${c.v} ${esc(c.channel)}</span><a href="${c.url}" target="_blank" rel="noopener">${c.t}</a><span>${esc(c.who)}</span>
    <span class="chip">${c.topic}</span><span class="chip ${gcls(c.grade)}">${c.grade}</span></div>
    <div class="tx">${esc(c.claim)}</div>
    ${c.nums?`<div class="nm">수치: ${esc(c.nums)}</div>`:""}
    ${c.screen?`<div class="nm">화면: ${esc(c.screen)}</div>`:""}
    ${c.note?`<div class="note">${esc(c.note)}</div>`:""}</div>`).join("");
}
[fv,ft,fg,fn].forEach(e=>e.onchange=render); fq.oninput=render; render();
try{ const t=localStorage.getItem("tax261010-tab"); if(t && document.getElementById(t)) show(t); }catch(e){}
</script>
