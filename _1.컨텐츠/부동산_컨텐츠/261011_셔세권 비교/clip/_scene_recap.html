 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

.it svg{flex:none}</style></head><body class="dots"><div class="stage" style="display:grid;grid-template-columns:1fr 1fr;gap:34px;align-content:center"><div class="hh" style="color:var(--ok)">숫자가 말한 것</div><div class="hh" style="color:var(--red)">말하지 않은 것</div><div class="card it" id="r0"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>수지 +31.5% · 평택 −15.9%</span></div><div class="card it" id="r1"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#C8463C;stroke-width:3"><path d="M6 6l12 12M18 6L6 18"/></svg><span>셔틀 때문에 올랐다</span></div><div class="card it" id="r2"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>동탄·기흥 거래 10분의 1</span></div><div class="card it" id="r3"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#C8463C;stroke-width:3"><path d="M6 6l12 12M18 6L6 18"/></svg><span>앞으로 오른다 · 내린다</span></div><div class="card it" id="r4"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#2F8F5B;stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>인구 늘어난 곳 ≠ 오른 곳</span></div><div class="card it" id="r5"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#C8463C;stroke-width:3"><path d="M6 6l12 12M18 6L6 18"/></svg><span>호재가 값을 올린다</span></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const O=[0,2,4,1,3,5];function F(t){O.forEach((k,j)=>{const v=K(P(t,.2+j*.4,.6+j*.4));const e=$('#r'+k);e.style.opacity=Math.min(1,v*1.4);e.style.transform=`scale(${v})`})}</script></body></html>
