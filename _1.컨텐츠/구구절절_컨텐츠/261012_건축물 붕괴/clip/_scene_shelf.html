<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NK';src:url('file:///C:/Windows/Fonts/NotoSansKR-VF.ttf');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F2;--card:#FFFFFF;--ink:#1E2330;--ink2:#4A5163;--muted:#8A8F9C;--line:#E7E1D6;
 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

.stage{position:absolute;left:70px;right:70px;top:250px;bottom:263px}

.mut{color:var(--muted)}
.ab{position:absolute}

svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{background-image:radial-gradient(#E9E2D5 1.6px,transparent 1.6px);background-size:26px 26px}
.slab{left:200px;right:200px;top:60px;height:50px;background:#9AA1AE;border-radius:10px}.str{top:110px;width:6px;height:240px;background:#5B6276;border-radius:3px;transform-origin:top}

.bulbs{display:flex;justify-content:space-between;padding:10px 20px}.bulbs i{width:30px;height:30px;border-radius:50%;background:#FFD45E;box-shadow:0 0 16px #FFD45E;opacity:0}
.tag{font-size:42px;font-weight:900}</style></head><body class="dots"><div class="stage"><div class="card ab" style="inset:0">
<div class="ab slab"></div><div class="ab str" id="s1" style="left:330px"></div><div class="ab str" id="s2" style="left:850px"></div>
<div class="ab shelf" id="sf"><div class="ly" id="l0"></div><div class="ly" id="l1"></div><div class="ly" id="l2"></div>
<div class="bulbs" id="bb"><i id="u0"></i><i id="u1"></i><i id="u2"></i><i id="u3"></i><i id="u4"></i><i id="u5"></i><i id="u6"></i><i id="u7"></i><i id="u8"></i><i id="u9"></i></div></div>
<div class="ab tag" id="g1" style="left:80px;top:470px">판 3겹</div><div class="ab tag" id="g2" style="left:80px;top:580px">조명 10개 <span class="mut" style="font-size:28px">(보도)</span></div>
<div class="ab pill" id="iv" style="right:60px;bottom:40px;background:var(--ink);color:#fff;font-size:34px">무엇이 결정적이었는지는 조사 중</div></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function F(t){for(let i=0;i<3;i++)$('#l'+i).style.opacity=P(t,.3+i*.35,.5+i*.35);$('#g1').style.opacity=P(t,1.2,1.5);
for(let i=0;i<10;i++)$('#u'+i).style.opacity=P(t,1.8+i*.08,1.9+i*.08);$('#g2').style.opacity=P(t,2.4,2.7);
const s=P(t,1.0,3.0);['#s1','#s2'].forEach(q=>{$(q).style.transform=`scaleY(${1+s*.08})`;$(q).style.background=s>.6?'#D07A22':'#5B6276'});
$('#sf').style.transform=`translateY(${s*19}px)`;$('#iv').style.opacity=P(t,3.2,3.6)}</script></body></html>
