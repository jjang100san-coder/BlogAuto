.rw b{color:#F5D047}.rw em{font-style:normal;text-align:right}.rw em::after{content:'점';font-size:32px;margin-left:4px;color:#9AA3B5}</style></head><body class="dots"><div class="stage" style="display:flex;flex-direction:column;gap:20px;justify-content:center"><div class="hd">K리그2 · 경기 뒤 순위 <span>(1·2위 바로 승격)</span></div><div class="card rw" id="r0" style="border:4px solid #2E62D9"><b>1</b><span>수원삼성</span><em id="p0">0</em></div><div class="card rw" id="r1" style=""><b>2</b><span>수원FC</span><em id="p1">0</em></div><div class="card rw" id="r2" style=""><b>3</b><span>서울 이랜드</span><em id="p2">0</em></div><div class="card rw" id="r3" style=""><b>4</b><span>대구</span><em id="p3">0</em></div><div class="pill" id="gap" style="background:#F5D047;color:#11131A;font-size:44px;align-self:center">남은 5경기 · 2위와 5점</div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const V=[59, 54, 54, 49];
function F(t){V.forEach((v,i)=>{const u=P(t,.2+i*.25,.9+i*.25);$('#r'+i).style.opacity=Math.min(1,u*2);$('#p'+i).textContent=Math.round(v*u)});
$('#gap').style.transform=`scale(${K(P(t,2.2,2.6))})`}</script></body></html>
