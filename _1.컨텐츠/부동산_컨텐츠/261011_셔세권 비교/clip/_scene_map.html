<!doctype html><html><head><meta charset="utf-8"><style>

 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

:#fff;stroke-width:2.4"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></div><div class="lb">화성 동탄구</div></div><div class="pin ab" id="p5" style="left:520px;top:740px"><div class="dot"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px;color:#fff;stroke-width:2.4"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></div><div class="lb">평택시</div></div><img class="icon3d ab" id="bus" src="icons/bus_t.png" style="height:150px;left:0;top:0"></div><div class="ab big" id="cnt" style="right:40px;bottom:30px;font-size:120px;color:var(--ink)">6곳</div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const R=document.getElementById('road'),L=R.getTotalLength();
function F(t){const u=P(t,.3,4.2),q=R.getPointAtLength(L*u);const b=$('#bus');b.style.transform=`translate(${q.x-110}px,${q.y-40}px)`;
for(let i=0;i<6;i++){const v=K(P(t,.4+i*.55,.75+i*.55));const p=$('#p'+i);p.style.opacity=Math.min(1,v*1.5);p.style.transform=`translate(-50%,-100%) scale(${v})`}
$('#cnt').style.opacity=P(t,3.8,4.3);b.style.opacity=1-P(t,3.9,4.4)}</script></body></html>
