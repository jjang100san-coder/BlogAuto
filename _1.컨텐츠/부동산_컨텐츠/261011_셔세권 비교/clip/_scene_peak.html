.vl{font-size:40px;font-weight:900;color:var(--pre);margin-top:12px}</style></head><body class="dots"><div class="stage"><div class="card ab" style="inset:0"><div class="zero ab"></div><div class="lim ab" id="lim"><span>−30%</span></div><div class="col ab" style="left:70px"><div class="nm">수지</div><div class="bar" id="k0"></div><div class="vl" id="kv0"></div></div><div class="col ab" style="left:250px"><div class="nm">동탄</div><div class="bar" id="k1"></div><div class="vl" id="kv1"></div></div><div class="col ab" style="left:430px"><div class="nm">영통</div><div class="bar" id="k2"></div><div class="vl" id="kv2"></div></div><div class="col ab" style="left:610px"><div class="nm">기흥</div><div class="bar" id="k3"></div><div class="vl" id="kv3"></div></div><div class="col ab" style="left:790px"><div class="nm">병점</div><div class="bar" id="k4"></div><div class="vl" id="kv4"></div></div><div class="col ab" style="left:970px"><div class="nm">평택</div><div class="bar" id="k5"></div><div class="vl" id="kv5"></div></div><div class="ab mut" style="left:40px;bottom:26px;font-size:28px;font-weight:700">올해 7~9월 거래 · 그 단지 이전 최고가 대비</div></div></div><script>

const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const V=[-2.3, -3.5, -8.7, -10.0, -18.4, -31.9];

if(i==5){b.style.background=u>.95?'#3D62AE':'#9DB0D6'}$('#kv'+i).textContent=u>0?'−'+(Math.abs(v)*u).toFixed(1)+'%':''});
