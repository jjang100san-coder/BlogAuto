.li i{width:30px;height:30px;border-radius:8px}.li b{color:var(--ink);font-weight:900}</style></head><body class="dots"><div class="stage"><div class="card ab" style="inset:0;padding:60px 60px"><div class="hh">손상 800건의 원인 <span class="mut">스위스 1976</span></div><div class="bar" id="br"><div class="sg" id="e0" style="background:#9AA1AE"></div><div class="sg" id="e1" style="background:#C9A06E"></div><div class="sg" id="e2" style="background:#C8463C"></div></div><div class="lg"><div class="li" id="x0"><i style="background:#9AA1AE"></i>아는 문제를 틀림 <b>64.5%</b></div><div class="li" id="x1"><i style="background:#C9A06E"></i>알면서 넘김 <b>21.75%</b></div><div class="li" id="x2"><i style="background:#C8463C"></i>처음 보는 문제 <b>13.75%</b></div></div><div class="hh" style="margin-top:60px" id="h2">그런데 손해액으로는</div><div class="bar"><div class="sg" id="loss" style="background:#C8463C"></div></div><div class="big" id="lv" style="font-size:72px;color:#C8463C;margin-top:18px">처음 보는 문제 43%</div></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const V=[64.5, 21.75, 13.75];const W=1090;
function F(t){V.forEach((v,i)=>{const u=P(t,.2+i*.5,.7+i*.5);$('#e'+i).style.width=(W*v/100*u)+'px';$('#x'+i).style.opacity=P(t,.5+i*.5,.8+i*.5)});
$('#h2').style.opacity=P(t,2.3,2.6);$('#loss').style.width=(W*.43*P(t,2.6,3.4))+'px';$('#lv').style.opacity=P(t,3.3,3.6)}</script></body></html>
