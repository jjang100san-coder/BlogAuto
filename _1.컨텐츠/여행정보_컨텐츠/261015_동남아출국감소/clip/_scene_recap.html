<!doctype html><html><head><meta charset="utf-8"><style>

*{box-sizing:border-box;margin:0;padding:0}

 --pre:#3D62AE;--pre-l:#E6ECF8;--ons:#D07A22;--ons-l:#FBEBDA;--red:#C8463C;--red-l:#F9E3E0;--ok:#2F8F5B;--ok-l:#E2F1E8;--sand:#F3EBDD}

.rr{display:grid;grid-template-columns:170px 200px 1fr;align-items:center;padding:24px 40px}.rr .k{font-size:56px;font-weight:900}.rr .v{font-size:54px;font-weight:900;color:var(--red)}</style></head><body class="dots"><div class="stage" style="display:flex;flex-direction:column;gap:24px;justify-content:center"><div class="card rr" id="r0"><img class="icon3d" src="icons/mag_t.png" style="height:130px"><div class="k">검색</div><div class="v">이웃 나라까지 한 달</div></div><div class="card rr" id="r1"><img class="icon3d" src="icons/heart_t.png" style="height:130px"><div class="k">마음</div><div class="v">동남아 전체 −24%</div></div><div class="card rr" id="r2"><img class="icon3d" src="icons/foot_t.png" style="height:130px"><div class="k">발길</div><div class="v">캄보디아만</div></div></div><script>
const E=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P=(t,a,b)=>E((t-a)/(b-a));
const K=u=>u<=0?0:u>=1?1:(u<.6?E(u/.6)*1.12:1.12-.12*E((u-.6)/.4));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const num=(x,d=0)=>x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
function F(t){for(let i=0;i<3;i++){const v=P(t,.2+i*.6,.6+i*.6);$('#r'+i).style.opacity=v;$('#r'+i).style.transform=`translateX(${(1-v)*-120}px)`}}</script></body></html>
